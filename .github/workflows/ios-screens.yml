name: iOS screenshots (Divo)

# Opens every screen on an iPhone simulator and keeps a screenshot of each, for
# review (and later the App Store). A Release build for the SIMULATOR with
# EXPO_PUBLIC_SCREENSHOT_SEED=1, in which the app walks itself through its
# screens with sample data (src/lib/tour.ts); every other build leaves that
# out. No Apple secrets, nothing published: artifacts only.
#
# Run trigger: a push to main whose commit message has [screens], or by hand.
# The repository is public only for the run (scripts/ci-build.sh).
# Build note: screenshot run 6 (one launch per step).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-screens
  cancel-in-progress: true

jobs:
  screens:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screens]') }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SCREENSHOT_SEED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install, not npm ci: see ios-sim.yml.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Select the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Generate the native project (expo prebuild, CocoaPods)
        run: npx expo prebuild --platform ios --clean

      - name: Build for the simulator (Release, screenshot seed on, no signing)
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Open every screen and capture it
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(r,x['udid'],x['name']) for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone') and 'Pro Max' not in x['name'] and 'Plus' not in x['name']]
          c.sort()
          print(c[-1][1])")
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          APP=$(ls -d dd/Build/Products/Release-iphonesimulator/*.app | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots
          shot () { xcrun simctl io "$UDID" screenshot "shots/$1.png" >/dev/null && echo "shot $1"; }

          # One launch per step (src/lib/tour.ts): `-tourStep N` reaches the app
          # through NSUserDefaults and it opens that step's screen with sample
          # data. A slow capture only delays the next launch, it cannot land on
          # the wrong screen. Keep SHOTS in step with TOUR.
          SHOTS=(02-today-gu 03-choghadiya-gu 04-vrat-gu 05-festival-diwali-gu 06-ekadashi-gu 07-calendar-gu 07b-calendar-scrolled-gu 08-day-sheet-gu 09-family-gu 10-person-gu 11-family-add-gu 12-settings-gu 13-search-gu 14-today-en-nj 15-festivals-en-nj 16-ekadashi-en-nj 17-today-dark-en 18-calendar-dark-en 19-festival-dark-en)
          xcrun simctl launch "$UDID" in.shubhpanchang.app
          sleep 12; shot 01-onboarding
          for i in "${!SHOTS[@]}"; do
            # Steps 16 to 18 are in dark appearance, the rest light.
            if [ "$i" = 16 ]; then xcrun simctl ui "$UDID" appearance dark; fi
            xcrun simctl launch --terminate-running-process "$UDID" in.shubhpanchang.app -tourStep "$i"
            sleep 14; shot "${SHOTS[$i]}"
          done
          ls -la shots

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-screens
          path: |
            shots
            build.log
          retention-days: 3
