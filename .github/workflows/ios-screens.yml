name: iOS screenshots (ShubhPanchang)

# Opens every screen on an iPhone simulator and keeps a screenshot of each, for
# review (and later the App Store). A Release build for the SIMULATOR with
# EXPO_PUBLIC_SCREENSHOT_SEED=1, in which the app walks itself through its
# screens with sample data (src/lib/tour.ts); every other build leaves that
# out. No Apple secrets, nothing published: artifacts only.
#
# Run trigger: a push to main whose commit message has [screens], or by hand.
# The repository is public only for the run (scripts/ci-build.sh).
# Build note: screenshot run 4 (shots early in each step).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-screens
  cancel-in-progress: true

jobs:
  screens:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[screens]') }}
    runs-on: macos-26
    timeout-minutes: 60
    env:
      EXPO_PUBLIC_SCREENSHOT_SEED: '1'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install, not npm ci: see ios-sim.yml.
      - name: Install
        run: npm install --no-audit --no-fund

      - name: Select the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Generate the native project (expo prebuild, CocoaPods)
        run: npx expo prebuild --platform ios --clean

      - name: Build for the simulator (Release, screenshot seed on, no signing)
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath dd CODE_SIGNING_ALLOWED=NO build 2>&1 \
            | tee build.log | grep -E "error:|BUILD (SUCCEEDED|FAILED)" || true
          grep -q "BUILD SUCCEEDED" build.log

      - name: Open every screen and capture it
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          c=[(r,x['udid'],x['name']) for r,l in d.items() if 'iOS' in r for x in l if x['name'].startswith('iPhone') and 'Pro Max' not in x['name'] and 'Plus' not in x['name']]
          c.sort()
          print(c[-1][1])")
          xcrun simctl list devices | grep "$UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance light
          APP=$(ls -d dd/Build/Products/Release-iphonesimulator/*.app | head -1)
          xcrun simctl install "$UDID" "$APP"
          mkdir -p shots warm
          # The simulator's first screenshots take tens of seconds (run 39604820009:
          # 14 s, then 60 s), which threw the capture times off the app's clock.
          # Take them before the app starts. A capture still takes a few seconds and
          # the app's clock runs a little ahead of L (run 39609607254), so each shot is
          # aimed early in its 20 s step.
          xcrun simctl io "$UDID" screenshot warm/1.png >/dev/null; xcrun simctl io "$UDID" screenshot warm/2.png >/dev/null
          shot () { xcrun simctl io "$UDID" screenshot "shots/$1.png" >/dev/null && echo "shot $1 at +$(( $(date +%s) - L ))s"; }
          # "if", not "&&": the step runs under bash -e, and a false test would end it.
          at () { local t=$(( L + $1 - $(date +%s) )); if [ "$t" -gt 0 ]; then sleep "$t"; fi; }

          # The app walks itself through its screens (src/lib/tour.ts: step i at
          # TOUR_START + i * TOUR_STEP seconds after launch, 20 and 20). Opening
          # shubhpanchang:// links from here would raise iOS's "Open in ...?"
          # dialog over every screen (run 39598825231). Keep this list in step
          # with TOUR.
          SHOTS=(02-today-gu 03-vrat-gu 04-family-gu 05-calendar-gu 06-settings-gu 07-family-add-gu 08-place-gu 09-today-en-nj 10-vrat-en-nj 11-today-dark-en 12-calendar-dark-en)
          xcrun simctl launch "$UDID" in.shubhpanchang.app
          L=$(date +%s)
          at 10; shot 01-onboarding
          for i in "${!SHOTS[@]}"; do
            # Steps 9 and 10 are in dark appearance.
            if [ "$i" = 9 ]; then at $(( 20 + 20 * 9 - 6 )); xcrun simctl ui "$UDID" appearance dark; fi
            at $(( 20 + 20 * i + 6 )); shot "${SHOTS[$i]}"
          done
          ls -la shots

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-screens
          path: |
            shots
            build.log
          retention-days: 3
