name: iOS TestFlight upload (Divo)

# Builds a SIGNED release and uploads it to App Store Connect (TestFlight).
# Runs only on a push to main whose commit message has [testflight], or by
# hand. It needs four GitHub Secrets that the owner sets (never written in
# this repository, never echoed): APPSTORE_ISSUER_ID, APPSTORE_KEY_ID,
# APPSTORE_KEY_P8 (the .p8 file contents), APPLE_TEAM_ID. docs/CI.md.
#
# Signing follows Sondra iOS: archive UNSIGNED (automatic signing at archive
# time wants an iOS Development profile, which needs a registered device:
# "Your team has no devices"), then sign at export with the cloud-managed
# Apple Distribution identity through the App Store Connect API key.
# The build number is the run number, so every upload is a new build.
#
# The repository is public only for the run (scripts/ci-build.sh).
# Build note: first TestFlight build (secrets set 2026-10-21).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[testflight]') }}
    runs-on: macos-26
    timeout-minutes: 75
    env:
      APPSTORE_ISSUER_ID: ${{ secrets.APPSTORE_ISSUER_ID }}
      APPSTORE_KEY_ID: ${{ secrets.APPSTORE_KEY_ID }}
      APPSTORE_KEY_P8: ${{ secrets.APPSTORE_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Check the secrets exist (names only, never values)
        run: |
          missing=""
          for n in APPSTORE_ISSUER_ID APPSTORE_KEY_ID APPSTORE_KEY_P8 APPLE_TEAM_ID; do
            [ -n "${!n}" ] || missing="$missing $n"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing GitHub Secrets:$missing (docs/CI.md)"
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm install, not npm ci: the lock file is written on Windows, where npm
      # leaves out optional packages for other platforms (@emnapi/* went
      # missing on run 39575249072), and npm ci refuses any gap.
      - name: Install, logic tests, typecheck
        run: |
          npm install --no-audit --no-fund
          npm test
          npx tsc --noEmit

      - name: Select the newest Xcode
        run: |
          X=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$X/Contents/Developer"
          xcodebuild -version

      - name: Build number = run number
        run: |
          node -e "
            const fs = require('fs');
            const p = 'app.json';
            const c = JSON.parse(fs.readFileSync(p, 'utf8'));
            c.expo.ios.buildNumber = String(process.env.GITHUB_RUN_NUMBER);
            fs.writeFileSync(p, JSON.stringify(c, null, 2));
            console.log('version', c.expo.version, 'build', c.expo.ios.buildNumber);
          "

      # Widgets need the App Group group.in.shubhpanchang.app, registered on
      # developer.apple.com (2026-10-22) with App Groups on in.shubhpanchang.app
      # and in.shubhpanchang.app.widgets: an API key cannot create App Groups.
      # 'off' builds without the widget extension (app.config.js).
      - name: Generate the native project (expo prebuild, CocoaPods)
        env:
          SP_WIDGETS: 'on'
        run: npx expo prebuild --platform ios --clean

      - name: Write the API key to a temp file (mode 600)
        run: |
          set +x
          KEY="$RUNNER_TEMP/AuthKey_${APPSTORE_KEY_ID}.p8"
          umask 077
          printf '%s\n' "$APPSTORE_KEY_P8" > "$KEY"
          echo "KEY_PATH=$KEY" >> "$GITHUB_ENV"

      - name: Archive (unsigned; the export step signs)
        run: |
          set -o pipefail
          WS=$(ls -d ios/*.xcworkspace | head -1)
          SCHEME=$(basename "$WS" .xcworkspace)
          xcodebuild -workspace "$WS" -scheme "$SCHEME" -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive 2>&1 | tee archive.log | grep -E "error:|ARCHIVE (SUCCEEDED|FAILED)" || true
          grep -q "ARCHIVE SUCCEEDED" archive.log

      # An unsigned archive carries no entitlements, and the export signs with
      # what it finds in the binaries: Universal Links (associated domains), the
      # widgets' App Group and push would be dropped. So sign the archive ad hoc
      # with each target's entitlements file first; the export then re-signs
      # for the App Store and keeps them (checked below, ENT| lines).
      - name: Put each target's entitlements on the archive (ad-hoc signature)
        run: |
          set -e
          PROJ=$(ls -d ios/*.xcodeproj | head -1)
          xcodebuild -project "$PROJ" -alltargets -configuration Release -showBuildSettings -json > settings.json 2>/dev/null
          APP=$(ls -d "$RUNNER_TEMP"/App.xcarchive/Products/Applications/*.app | head -1)
          python3 - "$APP" <<'PY'
          import json, os, subprocess, sys
          app = sys.argv[1]
          rows = json.load(open('settings.json'))
          ent = {r['buildSettings'].get('FULL_PRODUCT_NAME'): r['buildSettings'].get('CODE_SIGN_ENTITLEMENTS') for r in rows}
          targets = [os.path.join(app, 'PlugIns', x) for x in sorted(os.listdir(os.path.join(app, 'PlugIns')))] if os.path.isdir(os.path.join(app, 'PlugIns')) else []
          def sign_nested(bundle):
              # A bundle signs only over signed contents: frameworks and dylibs first (ad hoc, no entitlements).
              fw = os.path.join(bundle, 'Frameworks')
              if os.path.isdir(fw):
                  for x in sorted(os.listdir(fw)):
                      if x.endswith(('.framework', '.dylib')):
                          subprocess.run(['codesign', '--force', '--sign', '-', os.path.join(fw, x)], check=True)
          for path in targets + [app]:  # inside out: extensions before the app that holds them
              sign_nested(path)
              name = os.path.basename(path)
              e = ent.get(name)
              if not e:
                  print(f'ENTFILE|{name}|none'); continue
              f = os.path.join('ios', e)
              # The app sends local notifications only; aps-environment (remote push,
              # added by expo-notifications) would need Push on the App ID for nothing.
              import plistlib
              ents = plistlib.load(open(f, 'rb'))
              ents.pop('aps-environment', None)
              f = f + '.signed'
              plistlib.dump(ents, open(f, 'wb'))
              print(f'ENTFILE|{name}|{e}|{sorted(ents)}')
              subprocess.run(['codesign', '--force', '--sign', '-', '--entitlements', f, path], check=True)
          PY

      - name: Export and sign (cloud signing), show the entitlements
        run: |
          set -o pipefail
          opts () {
            cat <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$1</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          }
          opts export > "$RUNNER_TEMP/ExportLocal.plist"
          opts upload > "$RUNNER_TEMP/ExportOptions.plist"
          echo "EXPORT_OPTS=$RUNNER_TEMP/ExportOptions.plist" >> "$GITHUB_ENV"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportLocal.plist" \
            -exportPath "$RUNNER_TEMP/ipa" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" 2>&1 | tee export-local.log | tail -25
          grep -q "EXPORT SUCCEEDED" export-local.log
          cd "$RUNNER_TEMP/ipa" && unzip -q -o *.ipa
          for b in Payload/*.app Payload/*.app/PlugIns/*.appex; do
            [ -e "$b" ] || continue
            echo "ENT|$(basename "$b")"
            codesign -d --entitlements - --xml "$b" 2>/dev/null | plutil -convert xml1 -o - - | grep -E "<key>|<string>" | sed 's/^/ENT|  /'
          done

      - name: Upload to App Store Connect
        run: |
          set -o pipefail
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$EXPORT_OPTS" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPSTORE_KEY_ID" \
            -authenticationKeyIssuerID "$APPSTORE_ISSUER_ID" 2>&1 | tee export.log | tail -40
          # A green job is not enough: Apple must have taken the build.
          grep -q "EXPORT SUCCEEDED" export.log
          grep -qi "Uploaded" export.log
          echo "### Build ${{ github.run_number }} uploaded to App Store Connect" >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: ios-testflight-logs
          path: |
            archive.log
            export-local.log
            export.log
          retention-days: 3

      - name: Remove the key file
        if: always()
        run: rm -f "$KEY_PATH" || true
